<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boiler Eggs · hubmerto</title>
  <link rel="icon" type="image/svg+xml" href="/lab-ui/favicon.svg">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/lab-ui/lab-ui.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- Specimen-mode overlay (path /specimens/<id>): composite layout for
       portfolio renders. Hidden by default; main.js shows it when the
       URL matches. -->
  <div id="specimen-composite" aria-hidden="true">
    <div id="specimen-panel"></div>
    <svg id="specimen-line" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="specimen-caption"></div>
    <div id="specimen-split-rule" aria-hidden="true"></div>
  </div>

  <div id="dropzone-overlay" aria-hidden="true">
    <p>DROP A VIDEO FILE ANYWHERE</p>
  </div>

  <div id="hint" class="hint visible">
    <p>DRAG AND DROP A VIDEO, IMAGE, OR AUDIO FILE</p>
    <p>OR USE THE SOURCE FOLDER (TOP RIGHT)</p>
  </div>

  <!-- Two Layer needs two independent playheads on the same source.
       videoA is the primary (used as u_videoA + writes to ring buffer).
       videoB shadows A on the same src URL with its own currentTime / playbackRate. -->
  <video id="source-video"   playsinline muted loop crossorigin="anonymous"></video>
  <video id="source-video-b" playsinline muted loop crossorigin="anonymous"></video>
  <img   id="source-image" alt="" crossorigin="anonymous" />

  <script src="/lab-ui/lab-ui.js"></script>
  <script src="/lab-ui/lab-render.js"></script>
  <script src="/lab-ui/lab-mod.js"></script>
  <script src="/lab-ui/lab-app.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
